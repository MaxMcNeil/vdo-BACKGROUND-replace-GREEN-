name: Replace Green Screen Background + Beauté (yeux)

# Même remplacement du fond vert que les autres workflows, puis, uniquement sur toi :
#  - yeux recolorés (gris-bleu discret par défaut, force 30) : iris suivi image par image, pupille / reflets / paupières intacts
#  - nettoyage des bords : mur ou plafond visibles autour du tissu vert remplacés par le fond
# Vidéo prise dans une Release, sur Google Drive (lien ou rclone) ou via un lien direct.
# Toute durée : la vidéo est découpée en morceaux traités en parallèle, puis recollée.

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Vidéo : lien Google Drive / Dropbox / lien direct (https://...), ou chemin rclone (ex: gdrive:videos/ma_video.mp4). Vide = Release ci-dessous"
        required: false
        default: ''
      release_tag:
        description: 'Tag de la Release contenant la vidéo (ex: v1). Vide = dernière Release contenant une vidéo'
        required: false
        default: ''
      video_asset:
        description: "Nom du fichier vidéo dans cette Release (ex: video.mp4). Vide = la vidéo la plus récente de la Release"
        required: false
        default: ''
      eye_strength:
        description: "Yeux : 0 = désactivé (yeux naturels), 30 = discret (défaut), 80 = marqué, 100 = maximum"
        required: false
        default: '30'
      eye_color:
        description: 'Couleur des yeux'
        required: false
        type: choice
        default: gris_bleu
        options: [gris_bleu, bleu_clair, bleu_intense, vert]
      clean_edges:
        description: 'Remplacer aussi le mur / plafond visibles autour du tissu vert'
        required: false
        type: boolean
        default: true
      vert_interieur:
        description: "Retrait du vert sur toi : doux = habituel sur les bords, lissé à l’intérieur (veste/barbe sans grain, défaut) ; plein = ancien réglage partout"
        required: false
        type: choice
        default: doux
        options: [doux, plein]
      preview_seconds:
        description: "Test rapide : ne traiter que les N premières secondes (ex: 15). Vide = vidéo entière"
        required: false
        default: ''
      background_file:
        description: 'Image de fond pour les vidéos horizontales, dans input/ (ex: background.jpg)'
        required: false
        default: 'background.jpg'
      background_file_vertical:
        description: 'Image de fond pour les vidéos VERTICALES, dans input/ (ex: background-vertical.jpg)'
        required: false
        default: 'background-vertical.jpg'
      key_color:
        description: 'Couleur du fond vert en hex (ex: 139D74). Vide = mesure automatique'
        required: false
        default: ''
      dest:
        description: 'Dossier rclone où envoyer AUSSI le résultat (ex: gdrive:resultats). Vide = variable RCLONE_DEST si la source vient de rclone ou si le fichier dépasse 2 Go'
        required: false
        default: ''
      chunk_minutes:
        description: 'Durée de chaque morceau traité en parallèle, en minutes. Vide = automatique'
        required: false
        default: ''
      enchainer:
        description: "🔗 Chaîne : enchaîner ensuite Montage LV final puis les Shorts (Push-overlay)"
        required: false
        type: boolean
        default: false
      chaine_finder:
        description: "🔗 Chaîne — Vid-o-presse-finder. oui = recherche SELON TA VIDÉO (sources de chaque affirmation : vidéos, presse, Telegram, Reddit) + EN PLUS le dernier lot que tu as lancé toi-même ; non = aucune recherche. Le dossier Drive « montage-joints » est un plus : pris s'il contient des fichiers, jamais bloquant s'il est vide"
        required: false
        type: choice
        options: [oui, non]
        default: oui
      chaine_voix_studio:
        description: "🔗 Chaîne — voix studio chaude dans Montage LV final (profondeur, clarté, volume régulier ; repli sur ta voix normale au moindre doute)"
        required: false
        type: choice
        options: [non, oui]
        default: non

jobs:
  prepare:
    name: Préparer (source, mesure du fond, découpage)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      n_chunks: ${{ steps.plan.outputs.n_chunks }}
      key: ${{ steps.plan.outputs.key }}
      fps: ${{ steps.plan.outputs.fps }}
      has_audio: ${{ steps.plan.outputs.has_audio }}
      vertical: ${{ steps.plan.outputs.vertical }}
      out_w: ${{ steps.plan.outputs.out_w }}
      out_h: ${{ steps.plan.outputs.out_h }}
      hdr: ${{ steps.plan.outputs.hdr }}
      out_name: ${{ steps.plan.outputs.out_name }}
      mode: ${{ steps.src.outputs.mode }}
      release_tag: ${{ steps.src.outputs.release_tag }}
      video_asset: ${{ steps.src.outputs.video_asset }}
      source: ${{ steps.src.outputs.source }}
      bg: ${{ steps.plan.outputs.bg }}
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v5

      - name: Installer FFmpeg (et rclone si besoin)
        env:
          SOURCE: ${{ github.event.inputs.source }}
          HAS_RCLONE: ${{ secrets.RCLONE_CONFIG != '' }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if [ "$HAS_RCLONE" = "true" ]; then
            (curl -fsSL https://rclone.org/install.sh | sudo bash) || sudo apt-get install -y -qq rclone
            mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          fi

      - name: Chaîne — vérifier que tout est prêt (avant le traitement)
        if: github.event.inputs.enchainer == 'true'
        env:
          CHAINE_FINDER: ${{ github.event.inputs.chaine_finder }}
          CHAINE_VOIX_STUDIO: ${{ github.event.inputs.chaine_voix_studio }}
          PREVIEW: ${{ github.event.inputs.preview_seconds }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          CHAINE_JETON_CONFIGURE: ${{ (vars.CHAINE_APP_ID != '' && secrets.CHAINE_APP_KEY != '') || secrets.CHAINE_TOKEN != '' }}
        run: |
          if [ -n "$(echo "$PREVIEW" | tr -d ' ')" ]; then
            echo "::error title=Chaîne::« Test rapide » (preview_seconds) et « enchainer » ensemble : un extrait de test ne doit pas partir au montage. Vide preview_seconds ou décoche enchainer."
            exit 1
          fi
          bash scripts/chaine.sh verifier

      - name: Accéder à la vidéo source
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ github.event.inputs.source }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          VIDEO_ASSET: ${{ github.event.inputs.video_asset }}
        run: bash scripts/get_source.sh resolve

      - name: Garder la vidéo téléchargée pour les morceaux (lien direct / Google Drive)
        if: steps.src.outputs.mode == 'url'
        uses: actions/upload-artifact@v6
        with:
          name: source-video
          path: input/video.mp4
          retention-days: 1
          compression-level: 0

      - name: Analyser la vidéo (orientation, couleur du fond, découpage)
        id: plan
        env:
          KEY_OVERRIDE: ${{ github.event.inputs.key_color }}
          PREVIEW: ${{ github.event.inputs.preview_seconds }}
          CHUNK_MINUTES: ${{ github.event.inputs.chunk_minutes }}
          BGH: ${{ github.event.inputs.background_file }}
          BGV: ${{ github.event.inputs.background_file_vertical }}
        run: |
          python3 scripts/beauty_plan.py
          if [ "$(grep '^vertical=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" = "true" ]; then
            BG="input/${BGV:-background-vertical.jpg}"
          else
            BG="input/${BGH:-background.jpg}"
          fi
          test -f "$BG" || { echo "::error::Image de fond introuvable : $BG"; exit 1; }
          echo "bg=$BG" >> "$GITHUB_OUTPUT"

  chunks:
    name: Morceau ${{ matrix.idx }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v5

      - name: Installer FFmpeg, rclone et les outils de détection
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libgl1 libegl1 libgles2 libglib2.0-0 \
            || sudo apt-get install -y -qq ffmpeg
          if [ "$MODE" = "rclone" ]; then
            (curl -fsSL https://rclone.org/install.sh | sudo bash) || sudo apt-get install -y -qq rclone
            mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          fi
          python3 -m venv beauty-venv
          if ! beauty-venv/bin/pip install --quiet "mediapipe==1.1.1"; then
            beauty-venv/bin/pip install --quiet mediapipe \
              || echo "::warning::Installation de MediaPipe impossible : la vidéo sera produite sans retouche des yeux."
          fi
          beauty-venv/bin/python -c "import cv2, numpy" 2>/dev/null || beauty-venv/bin/pip install --quiet numpy opencv-contrib-python-headless
          beauty-venv/bin/python -c "import cv2; assert hasattr(cv2, 'ximgproc')" 2>/dev/null || echo "::notice::Filtre guidé absent : contours un peu plus doux."
          # Modèles (dans le repo, sinon téléchargés)
          M=models; mkdir -p "$M"
          test -s "$M/face_landmarker.task" || curl -fsSL --retry 3 -o "$M/face_landmarker.task" \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" || true
          test -s "$M/selfie_multiclass_256x256.tflite" || curl -fsSL --retry 3 -o "$M/selfie_multiclass_256x256.tflite" \
            "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite" || true
          ls -la "$M"

      - name: Récupérer la vidéo téléchargée (lien direct / Google Drive)
        if: needs.prepare.outputs.mode == 'url'
        uses: actions/download-artifact@v7
        with:
          name: source-video
          path: input

      - name: Accéder à la vidéo source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ needs.prepare.outputs.source }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VIDEO_ASSET: ${{ needs.prepare.outputs.video_asset }}
        run: bash scripts/get_source.sh open "${{ needs.prepare.outputs.mode }}"

      - name: Fond remplacé + yeux
        env:
          SS: ${{ matrix.ss }}
          LEN: ${{ matrix.len }}
          IDX: ${{ matrix.idx }}
          KEY: ${{ needs.prepare.outputs.key }}
          FPS: ${{ needs.prepare.outputs.fps }}
          OW: ${{ needs.prepare.outputs.out_w }}
          OH: ${{ needs.prepare.outputs.out_h }}
          HDR: ${{ needs.prepare.outputs.hdr }}
          BG: ${{ needs.prepare.outputs.bg }}
          HAS_AUDIO: ${{ needs.prepare.outputs.has_audio }}
          EYES: ${{ github.event.inputs.eye_strength }}
          EYE_COLOR: ${{ github.event.inputs.eye_color }}
          CLEAN: ${{ github.event.inputs.clean_edges }}
          VERT_INT: ${{ github.event.inputs.vert_interieur }}
        run: |
          mkdir -p output
          AUDIO=(); [ "$HAS_AUDIO" = "true" ] && AUDIO=(--audio-out "output/chunk_$IDX.wav")
          beauty-venv/bin/python scripts/beauty.py \
            --src "$SRC" --ss "$SS" --len "$LEN" --w "$OW" --h "$OH" --fps "$FPS" --hdr "${HDR:-false}" \
            --bg "$BG" --key "$KEY" --skin 0 --eyes "${EYES:-30}" \
            --eye-color "${EYE_COLOR:-gris_bleu}" --clean-edges "${CLEAN:-true}" --vert-interieur "${VERT_INT:-doux}" --models models \
            --out "output/chunk_$IDX.mp4" "${AUDIO[@]}"
          test -s "output/chunk_$IDX.mp4"
          if [ "$HAS_AUDIO" = "true" ]; then test -s "output/chunk_$IDX.wav"; fi
          ls -la output

      - name: Image de contrôle avant / après (premier morceau)
        if: matrix.idx == 0
        continue-on-error: true
        env:
          SS: ${{ matrix.ss }}
          LEN: ${{ matrix.len }}
        run: |
          # 3 images du premier morceau : à gauche l'original, à droite le résultat (jointe à la Release)
          ARGS=(); FILT=""; k=0
          for p in 0.2 0.5 0.8; do
            T=$(python3 -c "print(round(float('$LEN')*$p, 3))"); TS=$(python3 -c "print(round(float('$SS')+float('$LEN')*$p, 3))")
            ARGS+=(-ss "$TS" -i "$SRC" -ss "$T" -i "output/chunk_0.mp4")
            FILT+="[$((2*k)):v]scale=640:-2,setsar=1[a$k];[$((2*k+1)):v]scale=640:-2,setsar=1[b$k];[a$k][b$k]hstack[r$k];"
            k=$((k+1))
          done
          FILT+="[r0][r1][r2]vstack=3"
          ffmpeg -v error -y "${ARGS[@]}" -filter_complex "$FILT" -frames:v 1 -q:v 3 output/chunk_0.avant-apres.jpg
          ls -la output/chunk_0.avant-apres.jpg

      - name: Envoyer le morceau
        uses: actions/upload-artifact@v6
        with:
          name: chunk-${{ matrix.idx }}
          path: output/chunk_${{ matrix.idx }}.*
          retention-days: 1
          compression-level: 0

  assemble:
    name: Recoller et publier
    needs: [prepare, chunks]
    runs-on: ubuntu-24.04
    outputs:
      chaine_id: ${{ steps.dep.outputs.chaine_id }}
      video_id: ${{ steps.dep.outputs.video_id }}
      video_nom: ${{ steps.dep.outputs.video_nom }}
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Installer FFmpeg (et rclone si configuré)
        env:
          HAS_RCLONE: ${{ secrets.RCLONE_CONFIG != '' }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if [ "$HAS_RCLONE" = "true" ]; then
            (curl -fsSL https://rclone.org/install.sh | sudo bash) || sudo apt-get install -y -qq rclone
            mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          fi

      - name: Récupérer les morceaux
        uses: actions/download-artifact@v7
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true

      - name: Recoller
        env:
          N: ${{ needs.prepare.outputs.n_chunks }}
          HAS_AUDIO: ${{ needs.prepare.outputs.has_audio }}
          OUT_NAME: ${{ needs.prepare.outputs.out_name }}
        run: |
          : > videos.txt; : > audios.txt
          for i in $(seq 0 $((N-1))); do
            test -s "chunks/chunk_$i.mp4" || { echo "::error::Morceau $i manquant : relance les jobs en échec (Re-run failed jobs)"; exit 1; }
            echo "file '$PWD/chunks/chunk_$i.mp4'" >> videos.txt
            if [ "$HAS_AUDIO" = "true" ]; then
              test -s "chunks/chunk_$i.wav" || { echo "::error::Son du morceau $i manquant"; exit 1; }
              echo "file '$PWD/chunks/chunk_$i.wav'" >> audios.txt
            fi
          done
          mkdir -p output
          if [ "$HAS_AUDIO" = "true" ]; then
            ffmpeg -v error -y -f concat -safe 0 -i videos.txt -f concat -safe 0 -i audios.txt \
              -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart "output/$OUT_NAME"
          else
            ffmpeg -v error -y -f concat -safe 0 -i videos.txt -map 0:v -c:v copy -movflags +faststart "output/$OUT_NAME"
          fi
          test -s chunks/chunk_0.avant-apres.jpg && cp chunks/chunk_0.avant-apres.jpg output/avant-apres.jpg || true
          rm -rf chunks
          ls -lh output
          echo "SIZE=$(stat -c %s "output/$OUT_NAME")" >> "$GITHUB_ENV"

      - name: Publier comme Release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_NAME: ${{ needs.prepare.outputs.out_name }}
          SOURCE_DESC: ${{ github.event.inputs.source || format('{0} / {1}', needs.prepare.outputs.release_tag, needs.prepare.outputs.video_asset) }}
        run: |
          if [ "$SIZE" -ge 2000000000 ]; then
            echo "::warning::Résultat de plus de 2 Go : pas de Release possible (stockage externe ou artifact)."
            echo "big=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TAG="result-${{ github.run_number }}"
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "Résultat beauté run #${{ github.run_number }}" \
            --notes "Fond remplacé + yeux, généré automatiquement. Source : $SOURCE_DESC" \
            output/* || gh release upload "$TAG" output/* --repo "${{ github.repository }}" --clobber
          echo "- Release : https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Envoyer sur le stockage externe (rclone)
        env:
          DEST: ${{ github.event.inputs.dest || vars.RCLONE_DEST }}
          WANT: ${{ github.event.inputs.dest != '' || needs.prepare.outputs.mode == 'rclone' || steps.rel.outputs.big == 'true' }}
          HAS_RCLONE: ${{ secrets.RCLONE_CONFIG != '' }}
          OUT_NAME: ${{ needs.prepare.outputs.out_name }}
        run: |
          if [ "$WANT" != "true" ]; then echo "Pas d'envoi externe demandé."; exit 0; fi
          if [ "$HAS_RCLONE" != "true" ] || [ -z "$DEST" ]; then
            echo "::warning::Stockage externe non configuré (secret RCLONE_CONFIG + 'dest' ou variable RCLONE_DEST) : résultat disponible en artifact."
            exit 0
          fi
          rclone copyto "output/$OUT_NAME" "$DEST/$OUT_NAME" --retries 5
          LINK="$(rclone link "$DEST/$OUT_NAME" 2>/dev/null || true)"
          { echo "- Stockage : \`$DEST/$OUT_NAME\`"; [ -n "$LINK" ] && echo "- Lien : $LINK"; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload du résultat en artifact
        uses: actions/upload-artifact@v6
        with:
          name: video-beaute
          path: output/
          retention-days: 14
          compression-level: 0

      - name: Checkout des scripts de la chaîne
        if: github.event.inputs.enchainer == 'true'
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
          path: repo

      - name: Chaîne — déposer la vidéo pour le montage (Google Drive, privé)
        id: dep
        if: github.event.inputs.enchainer == 'true'
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          OUT_NAME: ${{ needs.prepare.outputs.out_name }}
          DEST: ${{ github.event.inputs.dest || vars.RCLONE_DEST }}
        run: bash repo/scripts/chaine.sh deposer "output/$OUT_NAME" "${DEST:+$DEST/$OUT_NAME}"

      - name: Nettoyer les morceaux temporaires
        # seulement si tout a réussi : en cas d'échec, « Re-run failed jobs » retrouve les morceaux (gardés 1 jour)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
                      --jq '.artifacts[] | select(.name|startswith("chunk-") or . == "source-video") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null || true
          done

  # 🔗 CHAÎNE : job séparé et léger. S'il échoue (jeton, réseau…), « Re-run failed jobs » ne refait QUE ce lancement.
  chaine:
    name: 🔗 Chaîne — lancer Montage LV final
    needs: [assemble]
    if: github.event.inputs.enchainer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout des scripts de la chaîne
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      - name: Jeton GitHub App
        id: chaine_tok
        if: vars.CHAINE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHAINE_CLIENT_ID || 'Iv23lis4ynP55Bsr8WhV' }}
          private-key: ${{ secrets.CHAINE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Montage-LV-final

      - name: Lancer Montage LV final
        env:
          CHAINE_FINDER: ${{ github.event.inputs.chaine_finder }}
          CHAINE_VOIX_STUDIO: ${{ github.event.inputs.chaine_voix_studio }}
          CHAINE_GH_TOKEN: ${{ steps.chaine_tok.outputs.token || secrets.CHAINE_TOKEN }}
          CHAINE_ID: ${{ needs.assemble.outputs.chaine_id }}
          CHAINE_VIDEO_ID: ${{ needs.assemble.outputs.video_id }}
          CHAINE_VIDEO_NOM: ${{ needs.assemble.outputs.video_nom }}
        run: bash scripts/chaine.sh lancer
