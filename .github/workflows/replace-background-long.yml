name: Replace Green Screen Background (vidéos longues)

# Traitement identique au workflow principal (mêmes filtres, mêmes réglages),
# mais la vidéo est découpée en morceaux traités en parallèle, puis recollée.
# Le résultat est envoyé sur un stockage externe (rclone) : un seul fichier, un seul lien.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dest:
        description: 'Dossier rclone de destination du résultat (ex: gdrive:resultats). Vide = variable RCLONE_DEST du repo'
        required: false
        default: ''
      source:
        description: 'Vidéo source sur ton stockage rclone (ex: gdrive:videos/long.mp4). Si vide : on utilise la Release ci-dessous'
        required: false
        default: ''
      release_tag:
        description: 'Tag de la Release contenant la vidéo (si source vide)'
        required: false
        default: ''
      video_asset:
        description: 'Nom du fichier vidéo dans cette Release (si source vide)'
        required: false
        default: ''
      background_file:
        description: 'Nom du fichier image de fond dans input/ (ex: background.jpg)'
        required: false
        default: 'background.jpg'
      background_file_vertical:
        description: 'Image de fond pour les vidéos VERTICALES, dans input/ (ex: background-vertical.jpg)'
        required: false
        default: 'background-vertical.jpg'
      key_color:
        description: 'Couleur du fond vert en hex (ex: 139D74). Laisser vide = mesure automatique'
        required: false
        default: ''
      clean_edges:
        description: 'Remplacer aussi le mur / plafond visibles autour du tissu vert (le traitement sur le tissu reste identique)'
        required: false
        type: boolean
        default: true
      chunk_minutes:
        description: 'Durée de chaque morceau en minutes (traités en parallèle). Vide = automatique (environ 12 morceaux, de 3 à 10 minutes)'
        required: false
        default: ''
      enchainer:
        description: "🔗 Chaîne : enchaîner ensuite Montage LV final puis les Shorts (Push-overlay)"
        required: false
        type: boolean
        default: false
      chaine_finder:
        description: "🔗 Chaîne — synchro Vid-o-presse-finder. oui = son dernier lot. non = SEULEMENT tes photos/vidéos du dossier Google Drive « montage-joints » (à remplir AVANT de lancer ; vidé après le montage)"
        required: false
        type: choice
        options: [oui, non]
        default: oui

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      key_hex: ${{ steps.plan.outputs.key_hex }}
      key_r: ${{ steps.plan.outputs.key_r }}
      key_g: ${{ steps.plan.outputs.key_g }}
      key_b: ${{ steps.plan.outputs.key_b }}
      key_ek: ${{ steps.plan.outputs.key_ek }}
      key_sim: ${{ steps.plan.outputs.key_sim }}
      key_thr: ${{ steps.plan.outputs.key_thr }}
      fps: ${{ steps.plan.outputs.fps }}
      has_audio: ${{ steps.plan.outputs.has_audio }}
      out_name: ${{ steps.plan.outputs.out_name }}
      vertical: ${{ steps.orient.outputs.vertical }}
      out_w: ${{ steps.orient.outputs.out_w }}
      hdr: ${{ steps.orient.outputs.hdr }}
      out_h: ${{ steps.orient.outputs.out_h }}
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer FFmpeg et rclone
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          (curl -fsSL https://rclone.org/install.sh | sudo bash) || sudo apt-get install -y rclone

      - name: Configurer rclone
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "Secret RCLONE_CONFIG manquant : Settings > Secrets and variables > Actions > New repository secret"
            echo "Colle-y le contenu de ton fichier rclone.conf (créé avec 'rclone config')."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Chaîne — vérifier que tout est prêt (avant le traitement)
        if: github.event.inputs.enchainer == 'true'
        env:
          CHAINE_FINDER: ${{ github.event.inputs.chaine_finder }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          CHAINE_JETON_CONFIGURE: ${{ (vars.CHAINE_APP_ID != '' && secrets.CHAINE_APP_KEY != '') || secrets.CHAINE_TOKEN != '' }}
        run: bash scripts/chaine.sh verifier

      - name: Accéder à la vidéo source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ github.event.inputs.source }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          VIDEO_ASSET: ${{ github.event.inputs.video_asset }}
        run: |
          mkdir -p input
          if [ -n "$SOURCE" ]; then
            case "$SOURCE" in *:*) ;; *) echo "::error::'source' doit avoir la forme remote:chemin/fichier.mp4 (ex: gdrive:videos/long.mp4)"; exit 1;; esac
            # remote:dossier/fichier.mp4 -> DIR=remote:dossier, FILE=fichier.mp4 ; remote:fichier.mp4 -> DIR=remote:, FILE=fichier.mp4
            REMOTE="${SOURCE%%:*}:"; PATHPART="${SOURCE#*:}"
            if [[ "$PATHPART" == */* ]]; then DIR="$REMOTE${PATHPART%/*}"; FILE="${PATHPART##*/}"; else DIR="$REMOTE"; FILE="$PATHPART"; fi
            # 1) rclone voit-il le fichier ? Sinon on affiche ce qu'il voit, pour trouver le bon chemin
            if ! rclone lsf "$SOURCE" > source-check.txt 2> source-check.err || [ ! -s source-check.txt ]; then
              echo "::error::Fichier introuvable via rclone : $SOURCE"
              echo "--- Message rclone :"; tail -5 source-check.err
              echo "--- Ce que rclone voit dans $DIR :"; rclone lsf "$DIR" --max-depth 1 2>&1 | head -40
              echo "Vérifie : le chemin exact (dossiers compris), les majuscules, l'extension, et que le fichier n'est pas seulement 'Partagé avec moi'."
              exit 1
            fi
            # 2) serveur local sur le stockage
            setsid nohup rclone serve http "$DIR" --addr 127.0.0.1:8081 --read-only > rclone-serve.log 2>&1 &
            ENC="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$FILE")"
            SRC="http://127.0.0.1:8081/$ENC"
            CODE=000
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -r 0-0 "$SRC" || true)
              case "$CODE" in 200|206) break;; esac
              sleep 1
            done
            case "$CODE" in 200|206) ;; *) echo "::error::Serveur rclone : réponse HTTP $CODE pour $SRC"; cat rclone-serve.log; exit 1;; esac
            echo "OUT_BASENAME=${FILE%.*}" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_TAG" ] && [ -n "$VIDEO_ASSET" ]; then
            gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern "$VIDEO_ASSET" --output "input/video.mp4" --clobber
            SRC="input/video.mp4"
            echo "OUT_BASENAME=${VIDEO_ASSET%.*}" >> "$GITHUB_ENV"
          else
            echo "Renseigne 'source' (rclone) ou 'release_tag' + 'video_asset'."; exit 1
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Détecter l'orientation de la vidéo (horizontale / verticale)
        id: orient
        env:
          VIDEO_PATH: ${{ env.SRC }}
          BGH: ${{ github.event.inputs.background_file }}
          BGV: ${{ github.event.inputs.background_file_vertical }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          src = os.environ.get("VIDEO_PATH") or os.environ["SRC"]
          j = json.loads(subprocess.check_output(["ffprobe", "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=width,height,color_transfer,avg_frame_rate,r_frame_rate:stream_side_data=rotation",
              "-of", "json", src]))
          s = j["streams"][0]
          w, h = int(s["width"]), int(s["height"])
          rot = 0
          for sd in s.get("side_data_list", []):
              if "rotation" in sd:
                  rot = int(round(float(sd["rotation"])))
          if abs(rot) % 180 == 90:      # vidéo tournée par métadonnée (téléphone) : on inverse
              w, h = h, w
          vertical = h > w
          if not vertical and abs(w / float(h) - 16 / 9.0) < 0.012:
              ow, oh = 1920, 1080       # 16:9 : sortie standard, comme avant
          else:
              k = min(1.0, 1920.0 / max(w, h))
              ow, oh = int(round(w * k / 2.0)) * 2, int(round(h * k / 2.0)) * 2
          hdr = s.get("color_transfer") in ("smpte2084", "arib-std-b67")

          def to_rate(t):
              try:
                  a, b = [float(x) for x in t.split("/")] if "/" in t else (float(t), 1.0)
                  return a / b if b else 0.0
              except Exception:
                  return 0.0
          rate = to_rate(s.get("avg_frame_rate", ""))
          if not 5.0 <= rate <= 120.0:
              alt = to_rate(s.get("r_frame_rate", ""))
              rate = alt if 5.0 <= alt <= 120.0 else 30.0
          std = {"24000/1001": 23.976, "24": 24.0, "25": 25.0, "30000/1001": 29.97, "30": 30.0, "50": 50.0, "60000/1001": 59.94, "60": 60.0}
          best = min(std.items(), key=lambda kv: abs(kv[1] - rate))
          fps = best[0] if abs(best[1] - rate) / rate < 0.01 else "%.3f" % rate

          print("Vidéo %dx%d -> %s, sortie %dx%d, %s i/s%s" % (w, h, "VERTICALE" if vertical else "horizontale", ow, oh, fps, ", HDR (conversion SDR)" if hdr else ""))
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write("vertical=%s\nout_w=%d\nout_h=%d\nhdr=%s\nfps=%s\n" % ("true" if vertical else "false", ow, oh, "true" if hdr else "false", fps))
          PY
          if [ "$(grep '^vertical=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" = "true" ]; then
            test -f "input/${BGV:-background-vertical.jpg}" || { echo "Image de fond verticale introuvable dans input/"; exit 1; }
          else
            test -f "input/${BGH:-background.jpg}" || { echo "Image de fond introuvable dans input/"; exit 1; }
          fi

      - name: Analyser la vidéo (couleur du fond, tolérance, seuil, découpage)
        id: plan
        env:
          KEY_OVERRIDE: ${{ github.event.inputs.key_color }}
          CHUNK_MINUTES: ${{ github.event.inputs.chunk_minutes }}
          HDR: ${{ steps.orient.outputs.hdr }}
        run: |
          cat > plan.py <<'PY'
          import os, math, json, subprocess, statistics as st
          SRC = os.environ["SRC"]
          W, H, N = 192, 108, 12
          TM = "zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=tonemap=mobius:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p," if os.environ.get("HDR") == "true" else ""

          def probe(*args):
              return subprocess.check_output(["ffprobe", "-v", "error", *args, SRC]).decode().strip()

          dur = float(probe("-show_entries", "format=duration", "-of", "csv=p=0"))
          fps = probe("-select_streams", "v:0", "-show_entries", "stream=avg_frame_rate", "-of", "csv=p=0")
          has_audio = "true" if probe("-select_streams", "a", "-show_entries", "stream=index", "-of", "csv=p=0") else "false"

          # Cadence constante : on arrondit à la valeur standard la plus proche (ex: 30.05 -> 30)
          def to_rate(txt):
              try:
                  a, b = [float(x) for x in txt.split("/")] if "/" in txt else (float(txt), 1.0)
                  return a / b if b else 0.0
              except Exception:
                  return 0.0
          rate = to_rate(fps)
          if not 5.0 <= rate <= 120.0:          # 0/0, 90000/1... : on essaie la cadence nominale, sinon 30
              alt = to_rate(probe("-select_streams", "v:0", "-show_entries", "stream=r_frame_rate", "-of", "csv=p=0"))
              rate = alt if 5.0 <= alt <= 120.0 else 30.0
          std = {"24000/1001": 23.976, "24": 24.0, "25": 25.0, "30000/1001": 29.97, "30": 30.0,
                 "50": 50.0, "60000/1001": 59.94, "60": 60.0}
          best = min(std.items(), key=lambda kv: abs(kv[1] - rate))
          fps = best[0] if abs(best[1] - rate) / rate < 0.01 else "%.3f" % rate

          # N images prises par recherche directe dans la vidéo (pas de lecture complète)
          fs = W * H * 3
          frames = []
          for k in range(N):
              t = dur * (k + 0.5) / N
              raw = subprocess.check_output(["ffmpeg", "-v", "error", "-ss", "%.3f" % t, "-i", SRC, "-frames:v", "1",
                                             "-vf", TM + "scale=%d:%d:flags=area,format=rgb24" % (W, H), "-f", "rawvideo", "-"])
              if len(raw) == fs:
                  frames.append(raw)
          if not frames:
              raise SystemExit("Impossible de lire des images de la vidéo (durée incohérente ou fichier corrompu)")

          def exg(p): return p[1] - (p[0] + p[2]) / 2
          def uvmag(r, g, b):
              u = -0.169 * r - 0.331 * g + 0.5 * b
              v = 0.5 * r - 0.419 * g - 0.081 * b
              return math.hypot(u, v)

          override = os.environ.get("KEY_OVERRIDE", "").strip().lstrip("#").upper()
          if len(override) == 6:
              R, G, B = [int(override[i:i + 2], 16) for i in (0, 2, 4)]
              print("Couleur imposée manuellement :", override)
          else:
              px = []
              for f in frames:
                  for y in range(H):
                      for x in range(W):
                          if y < H * 0.15 or ((x < W * 0.06 or x >= W * 0.94) and y < H * 0.60):
                              i = (y * W + x) * 3
                              px.append((f[i], f[i + 1], f[i + 2]))
              m = [st.median(p[i] for p in px) for i in range(3)]
              good = [p for p in px if abs(exg(p) - exg(m)) < 40 and p[1] > p[0] and p[1] > p[2]]
              if len(good) < 0.3 * len(px):
                  raise SystemExit("Mesure du fond vert peu fiable : relance avec key_color renseigné")
              R, G, B = [st.median(p[i] for p in good) for i in range(3)]
              R, G, B = round(R), round(G), round(B)

          EK = max(G - (R + B) / 2, 20.0)
          ref = uvmag(19, 157, 116)
          SIM = min(max(0.10 * uvmag(R, G, B) / ref, 0.05), 0.16)
          lum = (R + G + B) / 3
          THR = min(max(100 * lum / 98.0, 70.0), 150.0)
          hexk = "%02X%02X%02X" % (R, G, B)
          print("Fond : #%s  EK=%.1f  tolérance=%.3f  seuil=%.1f" % (hexk, EK, SIM, THR))

          raw_cm = (os.environ.get("CHUNK_MINUTES") or "").strip()
          try:
              L = max(float(raw_cm), 1.0) * 60 if raw_cm else None
          except ValueError:
              L = None
          if L is None:                         # automatique : ~12 morceaux en parallèle, de 3 à 10 minutes chacun
              L = min(max(dur / 12.0, 180.0), 600.0)
          L = max(L, dur / 250.0)               # jamais plus de 256 morceaux (limite de la matrice GitHub)
          include, start, idx = [], 0.0, 0
          while start < dur - 0.05:
              ln = min(L, dur - start)
              include.append({"idx": idx, "ss": round(start, 3), "len": round(ln, 3)})
              start += L; idx += 1
          print("Durée %.1f s -> %d morceaux de %.0f s max, fps=%s, audio=%s" % (dur, len(include), L, fps, has_audio))

          out = {"matrix": json.dumps({"include": include}), "key_hex": hexk, "key_r": R, "key_g": G, "key_b": B,
                 "key_ek": "%.2f" % EK, "key_sim": "%.3f" % SIM, "key_thr": "%.1f" % THR, "fps": fps,
                 "has_audio": has_audio, "out_name": os.environ.get("OUT_BASENAME", "video") + "_fond-remplace.mp4"}
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              for k, v in out.items():
                  o.write("%s=%s\n" % (k, v))
          PY
          python3 plan.py

  chunks:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      KEY_HEX: ${{ needs.prepare.outputs.key_hex }}
      KEY_R: ${{ needs.prepare.outputs.key_r }}
      KEY_G: ${{ needs.prepare.outputs.key_g }}
      KEY_B: ${{ needs.prepare.outputs.key_b }}
      KEY_EK: ${{ needs.prepare.outputs.key_ek }}
      KEY_SIM: ${{ needs.prepare.outputs.key_sim }}
      KEY_THR: ${{ needs.prepare.outputs.key_thr }}
      HDR: ${{ needs.prepare.outputs.hdr }}
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer FFmpeg et rclone
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          (curl -fsSL https://rclone.org/install.sh | sudo bash) || sudo apt-get install -y rclone

      - name: Configurer rclone
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Accéder à la vidéo source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ github.event.inputs.source }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          VIDEO_ASSET: ${{ github.event.inputs.video_asset }}
        run: |
          mkdir -p input
          if [ -n "$SOURCE" ]; then
            case "$SOURCE" in *:*) ;; *) echo "::error::'source' doit avoir la forme remote:chemin/fichier.mp4 (ex: gdrive:videos/long.mp4)"; exit 1;; esac
            # remote:dossier/fichier.mp4 -> DIR=remote:dossier, FILE=fichier.mp4 ; remote:fichier.mp4 -> DIR=remote:, FILE=fichier.mp4
            REMOTE="${SOURCE%%:*}:"; PATHPART="${SOURCE#*:}"
            if [[ "$PATHPART" == */* ]]; then DIR="$REMOTE${PATHPART%/*}"; FILE="${PATHPART##*/}"; else DIR="$REMOTE"; FILE="$PATHPART"; fi
            # 1) rclone voit-il le fichier ? Sinon on affiche ce qu'il voit, pour trouver le bon chemin
            if ! rclone lsf "$SOURCE" > source-check.txt 2> source-check.err || [ ! -s source-check.txt ]; then
              echo "::error::Fichier introuvable via rclone : $SOURCE"
              echo "--- Message rclone :"; tail -5 source-check.err
              echo "--- Ce que rclone voit dans $DIR :"; rclone lsf "$DIR" --max-depth 1 2>&1 | head -40
              echo "Vérifie : le chemin exact (dossiers compris), les majuscules, l'extension, et que le fichier n'est pas seulement 'Partagé avec moi'."
              exit 1
            fi
            # 2) serveur local sur le stockage
            setsid nohup rclone serve http "$DIR" --addr 127.0.0.1:8081 --read-only > rclone-serve.log 2>&1 &
            ENC="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$FILE")"
            SRC="http://127.0.0.1:8081/$ENC"
            CODE=000
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -r 0-0 "$SRC" || true)
              case "$CODE" in 200|206) break;; esac
              sleep 1
            done
            case "$CODE" in 200|206) ;; *) echo "::error::Serveur rclone : réponse HTTP $CODE pour $SRC"; cat rclone-serve.log; exit 1;; esac
          elif [ -n "$RELEASE_TAG" ] && [ -n "$VIDEO_ASSET" ]; then
            gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern "$VIDEO_ASSET" --output "input/video.mp4" --clobber
            SRC="input/video.mp4"
          else
            echo "Renseigne 'source' (rclone) ou 'release_tag' + 'video_asset'."; exit 1
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Générer la table de couleurs (dé-mélange du vert)
        run: |
          cat > mklut.py <<'PY'
          import os
          N = 65
          K = (float(os.environ["KEY_R"]), float(os.environ["KEY_G"]), float(os.environ["KEY_B"]))
          EK = float(os.environ["KEY_EK"])
          THR = float(os.environ["KEY_THR"])
          def f(r, g, b):
              a = 1 - max(g - (r + b) / 2, 0) / EK
              a = min(max(a, 0.4), 1.0)
              if (r + g + b) / 3 > THR:
                  r = min(max((r - (1 - a) * K[0]) / a, 0), 255)
                  g = min(max((g - (1 - a) * K[1]) / a, 0), 255)
                  b = min(max((b - (1 - a) * K[2]) / a, 0), 255)
              g = min(g, (r + b) / 2)
              b = min(b, r)
              return r, g, b
          with open("unmix.cube", "w") as o:
              o.write('TITLE "unmix"\nLUT_3D_SIZE %d\n' % N)
              for bi in range(N):
                  for gi in range(N):
                      for ri in range(N):
                          r, g, b = f(ri * 255 / (N - 1), gi * 255 / (N - 1), bi * 255 / (N - 1))
                          o.write("%.5f %.5f %.5f\n" % (r / 255, g / 255, b / 255))
          PY
          python3 mklut.py
          test -s unmix.cube

      - name: Nettoyage des bords (mur autour du tissu vert)
        if: github.event.inputs.clean_edges != 'false'
        continue-on-error: true
        env:
          SS: ${{ matrix.ss }}
          LEN: ${{ matrix.len }}
          FPS: ${{ needs.prepare.outputs.fps }}
          OWV: ${{ needs.prepare.outputs.out_w }}
          OHV: ${{ needs.prepare.outputs.out_h }}
        run: |
          # Masque supplémentaire : 255 sur toute la zone du tissu (le résultat y est identique à avant),
          # silhouette seule en dehors. En cas d'échec : pas de masque, traitement exactement comme avant.
          rm -f edgemask.mkv
          sudo apt-get install -y -qq --no-install-recommends libgl1 libegl1 libgles2 libglib2.0-0 || true
          python3 -m venv edge-venv && edge-venv/bin/pip install --quiet "mediapipe==1.1.1" || { echo "::warning::Outils indisponibles : pas de nettoyage des bords."; exit 0; }
          RC=0
          edge-venv/bin/python scripts/edge_mask.py --src "$SRC" --ss "$SS" --len "$LEN" --w "$OWV" --h "$OHV" --fps "$FPS" \
            --hdr "${HDR:-false}" --ek "$KEY_EK" --model models/selfie_multiclass_256x256.tflite --out edgemask.mkv || RC=$?
          if [ "$RC" != 0 ]; then rm -f edgemask.mkv; [ "$RC" = 3 ] || echo "::warning::Nettoyage des bords impossible : morceau traité comme avant."; fi
          test -s edgemask.mkv && echo "Masque des bords prêt." || true

      - name: Composer le morceau (mêmes filtres que le workflow principal)
        if: needs.prepare.outputs.vertical != 'true'
        env:
          IDX: ${{ matrix.idx }}
          SS: ${{ matrix.ss }}
          LEN: ${{ matrix.len }}
          FPS: ${{ needs.prepare.outputs.fps }}
          HAS_AUDIO: ${{ needs.prepare.outputs.has_audio }}
          BGH: ${{ github.event.inputs.background_file }}
          OWV: ${{ needs.prepare.outputs.out_w }}
          OHV: ${{ needs.prepare.outputs.out_h }}
        run: |
          mkdir -p output
          BG="input/${BGH:-background.jpg}"
          OW=${OWV:-1920}; OH=${OHV:-1080}
          TM=""; [ "$HDR" = "true" ] && TM="zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=tonemap=mobius:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p,"

          # Nettoyage des bords : masque multiplié (255 = inchangé)
          EDGE_IN=(); EDGE=""; MATOUT="[mat]"
          if [ -s edgemask.mkv ]; then EDGE_IN=(-i edgemask.mkv); MATOUT="[mat0]"; EDGE="[2:v]format=gray,setsar=1[keep]; [mat0][keep]blend=all_mode=multiply[mat];"; fi
          FILTER="
            [1:v]scale=$OW:$OH:force_original_aspect_ratio=increase,crop=$OW:$OH,setsar=1[bg];
            [0:v]${TM}scale=$OW:$OH,setsar=1,split=2[a][c];
            [a]format=yuva420p,chromakey=0x$KEY_HEX:$KEY_SIM:0.06,alphaextract,erosion,erosion,erosion,boxblur=1:1$MATOUT;
            $EDGE
            [c]format=gbrp,lut3d=file=unmix.cube:interp=tetrahedral,format=rgba[cl];
            [cl][mat]alphamerge[fg];
            [bg][fg]overlay=shortest=1:format=auto[out]
          "

          # Audio du morceau en WAV sans perte (recollé sans coupure puis encodé une seule fois)
          AUDIO_OUT=()
          if [ "$HAS_AUDIO" = "true" ]; then
            AUDIO_OUT=(-map 0:a:0 -c:a pcm_s16le -t "$LEN" "output/chunk_$IDX.wav")
          fi

          ffmpeg -y \
            -ss "$SS" -t "$LEN" -i "$SRC" \
            -framerate "$FPS" -loop 1 -i "$BG" \
            "${EDGE_IN[@]}" \
            -filter_complex "$FILTER" \
            -map "[out]" \
            -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p -r "$FPS" -fps_mode cfr \
            -t "$LEN" "output/chunk_$IDX.mp4" \
            "${AUDIO_OUT[@]}"

      - name: Composer le morceau VERTICAL (même traitement, format portrait)
        if: needs.prepare.outputs.vertical == 'true'
        env:
          IDX: ${{ matrix.idx }}
          SS: ${{ matrix.ss }}
          LEN: ${{ matrix.len }}
          FPS: ${{ needs.prepare.outputs.fps }}
          HAS_AUDIO: ${{ needs.prepare.outputs.has_audio }}
          BGV: ${{ github.event.inputs.background_file_vertical }}
          OWV: ${{ needs.prepare.outputs.out_w }}
          OHV: ${{ needs.prepare.outputs.out_h }}
        run: |
          mkdir -p output
          BG="input/${BGV:-background-vertical.jpg}"
          OW=${OWV:-1080}; OH=${OHV:-1920}
          TM=""; [ "$HDR" = "true" ] && TM="zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=tonemap=mobius:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p,"

          # Nettoyage des bords : masque multiplié (255 = inchangé)
          EDGE_IN=(); EDGE=""; MATOUT="[mat]"
          if [ -s edgemask.mkv ]; then EDGE_IN=(-i edgemask.mkv); MATOUT="[mat0]"; EDGE="[2:v]format=gray,setsar=1[keep]; [mat0][keep]blend=all_mode=multiply[mat];"; fi
          FILTER="
            [1:v]scale=$OW:$OH:force_original_aspect_ratio=increase,crop=$OW:$OH,setsar=1[bg];
            [0:v]${TM}scale=$OW:$OH,setsar=1,split=2[a][c];
            [a]format=yuva420p,chromakey=0x$KEY_HEX:$KEY_SIM:0.06,alphaextract,erosion,erosion,erosion,boxblur=1:1$MATOUT;
            $EDGE
            [c]format=gbrp,lut3d=file=unmix.cube:interp=tetrahedral,format=rgba[cl];
            [cl][mat]alphamerge[fg];
            [bg][fg]overlay=shortest=1:format=auto[out]
          "

          # Audio du morceau en WAV sans perte (recollé sans coupure puis encodé une seule fois)
          AUDIO_OUT=()
          if [ "$HAS_AUDIO" = "true" ]; then
            AUDIO_OUT=(-map 0:a:0 -c:a pcm_s16le -t "$LEN" "output/chunk_$IDX.wav")
          fi

          ffmpeg -y \
            -ss "$SS" -t "$LEN" -i "$SRC" \
            -framerate "$FPS" -loop 1 -i "$BG" \
            "${EDGE_IN[@]}" \
            -filter_complex "$FILTER" \
            -map "[out]" \
            -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p -r "$FPS" -fps_mode cfr \
            -t "$LEN" "output/chunk_$IDX.mp4" \
            "${AUDIO_OUT[@]}"

      - name: Envoyer le morceau sur le stockage externe
        env:
          IDX: ${{ matrix.idx }}
          DEST: ${{ github.event.inputs.dest || vars.RCLONE_DEST }}
        run: |
          TMP="$DEST/.tmp-run-${{ github.run_id }}"
          rclone copy output/ "$TMP" --include "chunk_$IDX.*" --transfers 2 --retries 5
          echo "Morceau $IDX envoyé. Contenu de $TMP :"; rclone lsf "$TMP" | grep "chunk_$IDX\\." || { echo "::error::Le morceau $IDX n'apparaît pas sur le stockage après l'envoi"; exit 1; }

  assemble:
    needs: [prepare, chunks]
    runs-on: ubuntu-latest
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Installer FFmpeg et rclone
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          (curl -fsSL https://rclone.org/install.sh | sudo bash) || sudo apt-get install -y rclone

      - name: Configurer rclone
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Recoller les morceaux et publier
        env:
          DEST: ${{ github.event.inputs.dest || vars.RCLONE_DEST }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          HAS_AUDIO: ${{ needs.prepare.outputs.has_audio }}
          OUT_NAME: ${{ needs.prepare.outputs.out_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TMP="$DEST/.tmp-run-$RUN_ID"
          N=${N_CHUNKS:-$(python3 -c 'import os,json;print(len(json.loads(os.environ["MATRIX"])["include"]))')}

          # 1) les morceaux sont-ils bien sur le stockage ? (un listing peut avoir quelques secondes de retard)
          OK=0
          for t in $(seq 1 18); do
            rclone lsf "$TMP" > listing.txt 2> listing.err || true
            OK=1
            for i in $(seq 0 $((N-1))); do
              grep -qxF "chunk_$i.mp4" listing.txt || OK=0
              if [ "$HAS_AUDIO" = "true" ]; then grep -qxF "chunk_$i.wav" listing.txt || OK=0; fi
            done
            [ "$OK" = 1 ] && break
            sleep 10
          done
          if [ "$OK" != 1 ]; then
            echo "::error::Morceaux manquants dans $TMP ($N attendus). Relance les jobs en échec (Re-run failed jobs)."
            echo "--- Contenu trouvé :"; cat listing.txt; tail -5 listing.err
            exit 1
          fi

          # 2) place disque : morceaux téléchargés + fichier final
          NEED=$(rclone size "$TMP" --json | python3 -c 'import sys,json;print(json.load(sys.stdin)["bytes"])')
          AVAIL=$(df --output=avail -B1 / | tail -1)
          echo "Taille des morceaux : $NEED octets ; espace disque libre : $AVAIL octets"
          if [ $((NEED * 2)) -gt $((AVAIL - 1000000000)) ]; then
            echo "::error::Espace disque insuffisant pour assembler le fichier final (vidéo trop longue pour un runner GitHub, environ 3 h maximum). Réduis la durée."
            exit 1
          fi

          # 3) télécharger les morceaux
          mkdir -p chunks
          rclone copy "$TMP" chunks --include "chunk_*" --transfers 4 --retries 5
          for i in $(seq 0 $((N-1))); do
            test -s "chunks/chunk_$i.mp4" || { echo "::error::Morceau $i non téléchargé"; exit 1; }
            if [ "$HAS_AUDIO" = "true" ]; then test -s "chunks/chunk_$i.wav" || { echo "::error::Audio du morceau $i non téléchargé"; exit 1; }; fi
          done

          # 4) recoller (image copiée telle quelle, son encodé une seule fois)
          : > videos.txt; : > audios.txt
          for i in $(seq 0 $((N-1))); do
            echo "file '$PWD/chunks/chunk_$i.mp4'" >> videos.txt
            echo "file '$PWD/chunks/chunk_$i.wav'" >> audios.txt
          done
          if [ "$HAS_AUDIO" = "true" ]; then
            ffmpeg -y -f concat -safe 0 -i videos.txt \
                      -f concat -safe 0 -i audios.txt \
                      -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart final.mp4
          else
            ffmpeg -y -f concat -safe 0 -i videos.txt \
                      -map 0:v -c:v copy -movflags +faststart final.mp4
          fi
          ls -lh final.mp4
          rm -rf chunks

          # 5) envoyer, lien, nettoyage
          rclone copyto final.mp4 "$DEST/$OUT_NAME" --retries 5
          LINK="$(rclone link "$DEST/$OUT_NAME" 2>/dev/null || true)"
          {
            echo "## Vidéo terminée"
            echo "- Fichier : \`$DEST/$OUT_NAME\`"
            [ -n "$LINK" ] && echo "- Lien : $LINK" || echo "- (ce stockage ne fournit pas de lien public : ouvre le fichier depuis ton stockage)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          rclone purge "$TMP" || true

      - name: Checkout des scripts de la chaîne
        if: github.event.inputs.enchainer == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          path: repo

      - name: Chaîne — jeton GitHub App
        id: chaine_tok
        if: github.event.inputs.enchainer == 'true' && vars.CHAINE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CHAINE_APP_ID }}
          private-key: ${{ secrets.CHAINE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Montage-LV-final

      - name: Chaîne — transmettre à Montage LV final
        if: github.event.inputs.enchainer == 'true'
        env:
          CHAINE_FINDER: ${{ github.event.inputs.chaine_finder }}
          CHAINE_GH_TOKEN: ${{ steps.chaine_tok.outputs.token || secrets.CHAINE_TOKEN }}
          DEST: ${{ github.event.inputs.dest || vars.RCLONE_DEST }}
          OUT_NAME: ${{ needs.prepare.outputs.out_name }}
        run: bash repo/scripts/chaine.sh envoyer "$DEST/$OUT_NAME"
