name: Replace Green Screen Background

permissions:
  contents: write
  actions: write

on:
  # Lancement manuel : tu précises le tag de la Release qui contient la vidéo
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la Release contenant la vidéo (ex: v1)'
        required: true
      video_asset:
        description: "Nom du fichier vidéo attaché à cette Release (ex: video.mp4)"
        required: true
      background_file:
        description: 'Nom du fichier image de fond dans input/ (ex: background.jpg)'
        required: false
        default: 'background.jpg'
      key_color:
        description: 'Couleur du fond vert en hex (ex: 139D74). Laisser vide = mesure automatique'
        required: false
        default: ''
      background_file_vertical:
        description: 'Image de fond pour les vidéos VERTICALES, dans input/ (ex: background-vertical.jpg)'
        required: false
        default: 'background-vertical.jpg'
      clean_edges:
        description: 'Remplacer aussi le mur / plafond visibles autour du tissu vert (le traitement sur le tissu reste identique)'
        required: false
        type: boolean
        default: true
      vert_interieur:
        description: "Retrait du vert sur toi : doux = habituel sur les bords, lissé à l’intérieur (veste/barbe sans grain, défaut) ; plein = ancien réglage partout"
        required: false
        type: choice
        default: doux
        options: [doux, plein]
      vitesse:
        description: "⏩ Vitesse de la vidéo (ta voix garde sa hauteur) : 1 = normale (défaut) ; 1.1 = 10 % plus rapide pour un rythme plus vif ; de 0.8 à 1.5"
        required: false
        default: "1"
      force_single:
        description: "Mettre 'true' pour forcer le traitement normal même si la vidéo est longue"
        required: false
        default: 'false'
      enchainer:
        description: "🔗 Chaîne : enchaîner ensuite Montage LV final puis les Shorts (Push-overlay)"
        required: false
        type: boolean
        default: false
      chaine_voix_studio:
        description: "🔗 Chaîne — voix studio chaude dans Montage LV final (profondeur, clarté, volume régulier ; repli sur ta voix normale au moindre doute)"
        required: false
        type: choice
        options: [non, oui]
        default: non
      chaine_shorts_sous_titres:
        description: "🔗 Chaîne — sous-titres dans les Shorts (gros, lisibles, jamais sur ton visage) : oui / non"
        required: false
        type: choice
        default: oui
        options: [oui, non]

jobs:
  replace-background:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v5

      - name: Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Préparer les noms de fichiers
        id: files
        env:
          BGFILE: ${{ github.event.inputs.background_file }}
        run: |
          BG="${BGFILE:-background.jpg}"
          echo "bg=$BG" >> "$GITHUB_OUTPUT"

      - name: Télécharger la vidéo depuis la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RTAG: ${{ github.event.inputs.release_tag }}
          RASSET: ${{ github.event.inputs.video_asset }}
        run: |
          mkdir -p input
          gh release download "$RTAG" \
            --repo "${{ github.repository }}" \
            --pattern "$RASSET" \
            --output "input/video.mp4" \
            --clobber

      - name: Vérifier que les fichiers existent
        run: |
          test -f "input/video.mp4" || (echo "Vidéo introuvable — vérifie le tag/nom d'asset de la Release" && exit 1)

      - name: Chaîne — vérifier que tout est prêt (avant le traitement)
        if: github.event.inputs.enchainer == 'true'
        env:
          CHAINE_VOIX_STUDIO: ${{ github.event.inputs.chaine_voix_studio }}
          CHAINE_SHORTS_SOUS_TITRES: ${{ github.event.inputs.chaine_shorts_sous_titres }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          CHAINE_JETON_CONFIGURE: ${{ (vars.CHAINE_APP_ID != '' && secrets.CHAINE_APP_KEY != '') || secrets.CHAINE_TOKEN != '' }}
        run: bash scripts/chaine.sh verifier

      - name: Aiguillage (vidéo longue -> workflow dédié, découpage en parallèle)
        id: route
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LONG_MINUTES: '15'
          FORCE_SINGLE: ${{ github.event.inputs.force_single }}
          RCLONE_DEST: ${{ vars.RCLONE_DEST }}
          HAS_RCLONE: ${{ secrets.RCLONE_CONFIG != '' }}
          KEY_COLOR: ${{ github.event.inputs.key_color }}
          RTAG: ${{ github.event.inputs.release_tag }}
          RASSET: ${{ github.event.inputs.video_asset }}
          BGH: ${{ steps.files.outputs.bg }}
          BGV: ${{ github.event.inputs.background_file_vertical }}
          CLEAN_EDGES: ${{ github.event.inputs.clean_edges }}
          ENCHAINER: ${{ github.event.inputs.enchainer }}
          CHAINE_VOIX_STUDIO: ${{ github.event.inputs.chaine_voix_studio }}
          CHAINE_SHORTS_SOUS_TITRES: ${{ github.event.inputs.chaine_shorts_sous_titres }}
          VERT_INT: ${{ github.event.inputs.vert_interieur }}
          VITESSE: ${{ github.event.inputs.vitesse }}
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "input/video.mp4")
          echo "Durée de la vidéo : ${DUR}s (seuil vidéo longue : ${LONG_MINUTES} min)"
          if [ "$FORCE_SINGLE" = "true" ]; then
            echo "force_single=true : traitement normal."
          elif python3 -c "import sys; sys.exit(0 if float('$DUR') > float('$LONG_MINUTES')*60 else 1)" 2>/dev/null; then
            if [ -z "$RCLONE_DEST" ] || [ "$HAS_RCLONE" != "true" ]; then
              echo "::warning::Vidéo longue détectée, mais le stockage externe n'est pas configuré (secret RCLONE_CONFIG + variable RCLONE_DEST) : traitement normal, avec risque de dépasser les limites de GitHub."
            else
            ARGS=(-f "release_tag=$RTAG" -f "video_asset=$RASSET" -f "background_file=$BGH" -f "background_file_vertical=${BGV:-background-vertical.jpg}" -f "dest=$RCLONE_DEST")
            [ -n "$KEY_COLOR" ] && ARGS+=(-f "key_color=$KEY_COLOR")
            ARGS+=(-f "clean_edges=${CLEAN_EDGES:-true}")
            ARGS+=(-f "enchainer=${ENCHAINER:-false}")
            ARGS+=(-f "chaine_voix_studio=${CHAINE_VOIX_STUDIO:-non}" -f "chaine_shorts_sous_titres=${CHAINE_SHORTS_SOUS_TITRES:-oui}" -f "vert_interieur=${VERT_INT:-doux}" -f "vitesse=${VITESSE:-1}")
            if gh workflow run replace-background-long.yml --repo "${{ github.repository }}" "${ARGS[@]}"; then
              echo "long=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Vidéo longue : traitement lancé dans le workflow 'vidéos longues' (onglet Actions). Le résultat sera envoyé sur ton stockage externe."
            else
              echo "::warning::Impossible de lancer le workflow des vidéos longues (droits ou réseau) : traitement normal, avec risque de dépasser les limites de GitHub."
            fi
            fi
          fi

      - name: Détecter l'orientation de la vidéo (horizontale / verticale)
        id: orient
        if: steps.route.outputs.long != 'true'
        continue-on-error: true
        env:
          VIDEO_PATH: input/video.mp4
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          src = os.environ.get("VIDEO_PATH") or os.environ["SRC"]
          j = json.loads(subprocess.check_output(["ffprobe", "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=width,height,color_transfer,avg_frame_rate,r_frame_rate:stream_side_data=rotation",
              "-of", "json", src]))
          s = j["streams"][0]
          w, h = int(s["width"]), int(s["height"])
          rot = 0
          for sd in s.get("side_data_list", []):
              if "rotation" in sd:
                  rot = int(round(float(sd["rotation"])))
          if abs(rot) % 180 == 90:      # vidéo tournée par métadonnée (téléphone) : on inverse
              w, h = h, w
          vertical = h > w
          if not vertical and abs(w / float(h) - 16 / 9.0) < 0.012:
              ow, oh = 1920, 1080       # 16:9 : sortie standard, comme avant
          else:
              k = min(1.0, 1920.0 / max(w, h))
              ow, oh = int(round(w * k / 2.0)) * 2, int(round(h * k / 2.0)) * 2
          hdr = s.get("color_transfer") in ("smpte2084", "arib-std-b67")

          def to_rate(t):
              try:
                  a, b = [float(x) for x in t.split("/")] if "/" in t else (float(t), 1.0)
                  return a / b if b else 0.0
              except Exception:
                  return 0.0
          rate = to_rate(s.get("avg_frame_rate", ""))
          if not 5.0 <= rate <= 120.0:
              alt = to_rate(s.get("r_frame_rate", ""))
              rate = alt if 5.0 <= alt <= 120.0 else 30.0
          std = {"24000/1001": 23.976, "24": 24.0, "25": 25.0, "30000/1001": 29.97, "30": 30.0, "50": 50.0, "60000/1001": 59.94, "60": 60.0}
          best = min(std.items(), key=lambda kv: abs(kv[1] - rate))
          fps = best[0] if abs(best[1] - rate) / rate < 0.01 else "%.3f" % rate

          print("Vidéo %dx%d -> %s, sortie %dx%d, %s i/s%s" % (w, h, "VERTICALE" if vertical else "horizontale", ow, oh, fps, ", HDR (conversion SDR)" if hdr else ""))
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write("vertical=%s\nout_w=%d\nout_h=%d\nhdr=%s\nfps=%s\n" % ("true" if vertical else "false", ow, oh, "true" if hdr else "false", fps))
          PY

      - name: Analyser le fond vert (couleur, tolérance, seuil)
        if: steps.route.outputs.long != 'true'
        env:
          KEY_OVERRIDE: ${{ github.event.inputs.key_color }}
          HDR: ${{ steps.orient.outputs.hdr }}
        run: |
          cat > analyze.py <<'PY'
          import os, math, subprocess, statistics as st
          VIDEO = "input/video.mp4"
          W, H, N = 192, 108, 12
          TM = "zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=tonemap=mobius:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p," if os.environ.get("HDR") == "true" else ""
          dur = float(subprocess.check_output(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", VIDEO]).decode().strip())
          raw = subprocess.check_output(["ffmpeg", "-v", "error", "-i", VIDEO, "-vf", "fps=%.4f," % (N / dur) + TM + "scale=%d:%d:flags=area,format=rgb24" % (W, H), "-frames:v", str(N), "-f", "rawvideo", "-"])
          fs = W * H * 3
          frames = [raw[i * fs:(i + 1) * fs] for i in range(len(raw) // fs)]

          def exg(p): return p[1] - (p[0] + p[2]) / 2
          def uvmag(r, g, b):
              u = -0.169 * r - 0.331 * g + 0.5 * b
              v = 0.5 * r - 0.419 * g - 0.081 * b
              return math.hypot(u, v)

          override = os.environ.get("KEY_OVERRIDE", "").strip().lstrip("#").upper()
          if len(override) == 6:
              R, G, B = [int(override[i:i + 2], 16) for i in (0, 2, 4)]
              print("Couleur imposée manuellement :", override)
          else:
              # Bords supposés libres : bandeau du haut + colonnes gauche/droite (haut de l'image)
              px = []
              for f in frames:
                  for y in range(H):
                      for x in range(W):
                          if y < H * 0.15 or ((x < W * 0.06 or x >= W * 0.94) and y < H * 0.60):
                              i = (y * W + x) * 3
                              px.append((f[i], f[i + 1], f[i + 2]))
              m = [st.median(p[i] for p in px) for i in range(3)]
              good = [p for p in px if abs(exg(p) - exg(m)) < 40 and p[1] > p[0] and p[1] > p[2]]
              if len(good) < 0.3 * len(px):
                  raise SystemExit("Mesure du fond vert peu fiable : relance avec key_color renseigné")
              R, G, B = [st.median(p[i] for p in good) for i in range(3)]
              R, G, B = round(R), round(G), round(B)

          EK = max(G - (R + B) / 2, 20.0)
          # Référence calibrée sur le tissu d'origine (#139D74 -> tolérance 0.10, seuil 100)
          ref = uvmag(19, 157, 116)
          SIM = min(max(0.10 * uvmag(R, G, B) / ref, 0.05), 0.16)
          lum = (R + G + B) / 3
          THR = min(max(100 * lum / 98.0, 70.0), 150.0)
          hexk = "%02X%02X%02X" % (R, G, B)
          print("Fond : #%s  EK=%.1f  tolérance=%.3f  seuil=%.1f" % (hexk, EK, SIM, THR))
          with open(os.environ["GITHUB_ENV"], "a") as e:
              e.write("KEY_HEX=%s\nKEY_R=%d\nKEY_G=%d\nKEY_B=%d\nKEY_EK=%.2f\nKEY_SIM=%.3f\nKEY_THR=%.1f\n" % (hexk, R, G, B, EK, SIM, THR))
          PY
          python3 analyze.py

      - name: Générer la table de couleurs (dé-mélange du vert)
        if: steps.route.outputs.long != 'true'
        run: |
          # Pour chaque couleur RGB possible : estime la part de fond vert dans le pixel,
          # reconstruit la vraie couleur du sujet (surtout utile sur les doigts flous),
          # puis plafonne le vert/bleu résiduel. Pixels sombres (cheveux) préservés.
          cat > mklut.py <<'PY'
          import os
          N = 65
          K = (float(os.environ["KEY_R"]), float(os.environ["KEY_G"]), float(os.environ["KEY_B"]))
          EK = float(os.environ["KEY_EK"])
          THR = float(os.environ["KEY_THR"])
          def f(r, g, b):
              a = 1 - max(g - (r + b) / 2, 0) / EK
              a = min(max(a, 0.4), 1.0)
              if (r + g + b) / 3 > THR:
                  r = min(max((r - (1 - a) * K[0]) / a, 0), 255)
                  g = min(max((g - (1 - a) * K[1]) / a, 0), 255)
                  b = min(max((b - (1 - a) * K[2]) / a, 0), 255)
              g = min(g, (r + b) / 2)
              b = min(b, r)
              return r, g, b
          with open("unmix.cube", "w") as o:
              o.write('TITLE "unmix"\nLUT_3D_SIZE %d\n' % N)
              for bi in range(N):
                  for gi in range(N):
                      for ri in range(N):
                          r, g, b = f(ri * 255 / (N - 1), gi * 255 / (N - 1), bi * 255 / (N - 1))
                          o.write("%.5f %.5f %.5f\n" % (r / 255, g / 255, b / 255))
          PY
          python3 mklut.py
          test -s unmix.cube

      - name: Nettoyage des bords (mur autour du tissu vert)
        if: steps.route.outputs.long != 'true' && github.event.inputs.clean_edges != 'false'
        continue-on-error: true
        env:
          OWV: ${{ steps.orient.outputs.out_w }}
          OHV: ${{ steps.orient.outputs.out_h }}
          FPSV: ${{ steps.orient.outputs.fps }}
          HDR: ${{ steps.orient.outputs.hdr }}
        run: |
          # Masque supplémentaire : 255 sur toute la zone du tissu (le résultat y est identique à avant),
          # silhouette seule en dehors. En cas d'échec : pas de masque, traitement exactement comme avant.
          rm -f edgemask.mkv
          sudo apt-get install -y -qq --no-install-recommends libgl1 libegl1 libgles2 libglib2.0-0 || true
          python3 -m venv edge-venv && edge-venv/bin/pip install --quiet "mediapipe==1.1.1" || { echo "::warning::Outils indisponibles : pas de nettoyage des bords."; exit 0; }
          RC=0
          edge-venv/bin/python scripts/edge_mask.py --src input/video.mp4 --w "${OWV:-1920}" --h "${OHV:-1080}" --fps "${FPSV:-30}" \
            --hdr "${HDR:-false}" --ek "$KEY_EK" --model models/selfie_multiclass_256x256.tflite --out edgemask.mkv || RC=$?
          if [ "$RC" != 0 ]; then rm -f edgemask.mkv; [ "$RC" = 3 ] || echo "::warning::Nettoyage des bords impossible : vidéo traitée comme avant."; fi
          test -s edgemask.mkv && echo "Masque des bords prêt." || true

      - name: Composer la vidéo (chromakey + masque propre + couleurs reconstruites)
        if: steps.route.outputs.long != 'true' && steps.orient.outputs.vertical != 'true'
        env:
          BGH: ${{ steps.files.outputs.bg }}
          OWV: ${{ steps.orient.outputs.out_w }}
          OHV: ${{ steps.orient.outputs.out_h }}
          VERT_INT: ${{ github.event.inputs.vert_interieur }}
          FPSV: ${{ steps.orient.outputs.fps }}
          HDR: ${{ steps.orient.outputs.hdr }}
        run: |
          mkdir -p output
          BG="input/$BGH"
          test -f "$BG" || { echo "Image de fond introuvable dans input/ : $BGH"; exit 1; }
          OW=${OWV:-1920}; OH=${OHV:-1080}; FPS=${FPSV:-30}
          TM=""; [ "$HDR" = "true" ] && TM="zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=tonemap=mobius:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p,"

          # Masque : chromakey serré + érosion + léger flou. Couleur : table unmix.cube.
          # (HDR : conversion SDR avant traitement ; fond recadré au centre, jamais étiré)
          # Nettoyage des bords : masque multiplié (255 = inchangé)
          EDGE_IN=(); EDGE=""; MATOUT="[mat]"
          if [ -s edgemask.mkv ]; then EDGE_IN=(-i edgemask.mkv); MATOUT="[mat0]"; EDGE="[2:v]format=gray,setsar=1[keep]; [mat0][keep]blend=all_mode=multiply[mat];"; fi
          FILTER="
            [1:v]scale=$OW:$OH:force_original_aspect_ratio=increase,crop=$OW:$OH,setsar=1[bg];
            [0:v]${TM}scale=$OW:$OH,setsar=1,split=2[a][c];
            [a]format=yuva420p,chromakey=0x$KEY_HEX:$KEY_SIM:0.06,alphaextract,erosion,erosion,erosion,boxblur=1:1$MATOUT;
            $EDGE
            @COLOR@
            [bg][fg]overlay=shortest=1:format=auto[out]
          "

          VI_MODE="${VERT_INT:-doux}"; [ "$VI_MODE" = plein ] || VI_MODE=doux
          echo "Retrait du vert sur toi : $VI_MODE"
          for VI_TRY in "$VI_MODE" plein; do
            COLOR=$(bash scripts/vert_interieur.sh "$VI_TRY" "$OW" "$OH")
            F="${FILTER/@COLOR@/"$COLOR"}"
            if ffmpeg -y \
              -i "input/video.mp4" \
              -framerate "$FPS" -loop 1 -i "$BG" \
              "${EDGE_IN[@]}" \
              -filter_complex "$F" \
              -map "[out]" -map 0:a? \
              -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p \
              -c:a aac -b:a 192k \
              output/result.mp4; then break; fi
            [ "$VI_TRY" = plein ] && exit 1
            echo "::warning::Retrait lissé du vert en échec : relance avec le réglage habituel (plein)."
          done

      - name: Composer la vidéo VERTICALE (même traitement, format portrait)
        if: steps.route.outputs.long != 'true' && steps.orient.outputs.vertical == 'true'
        env:
          BGV: ${{ github.event.inputs.background_file_vertical }}
          OWV: ${{ steps.orient.outputs.out_w }}
          OHV: ${{ steps.orient.outputs.out_h }}
          VERT_INT: ${{ github.event.inputs.vert_interieur }}
          FPSV: ${{ steps.orient.outputs.fps }}
          HDR: ${{ steps.orient.outputs.hdr }}
        run: |
          mkdir -p output
          BG="input/${BGV:-background-vertical.jpg}"
          test -f "$BG" || { echo "Image de fond verticale introuvable : $BG"; exit 1; }
          OW=${OWV:-1080}; OH=${OHV:-1920}; FPS=${FPSV:-30}
          TM=""; [ "$HDR" = "true" ] && TM="zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=tonemap=mobius:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p,"

          # Masque : chromakey serré + érosion + léger flou. Couleur : table unmix.cube.
          # (HDR : conversion SDR avant traitement ; fond recadré au centre, jamais étiré)
          # Nettoyage des bords : masque multiplié (255 = inchangé)
          EDGE_IN=(); EDGE=""; MATOUT="[mat]"
          if [ -s edgemask.mkv ]; then EDGE_IN=(-i edgemask.mkv); MATOUT="[mat0]"; EDGE="[2:v]format=gray,setsar=1[keep]; [mat0][keep]blend=all_mode=multiply[mat];"; fi
          FILTER="
            [1:v]scale=$OW:$OH:force_original_aspect_ratio=increase,crop=$OW:$OH,setsar=1[bg];
            [0:v]${TM}scale=$OW:$OH,setsar=1,split=2[a][c];
            [a]format=yuva420p,chromakey=0x$KEY_HEX:$KEY_SIM:0.06,alphaextract,erosion,erosion,erosion,boxblur=1:1$MATOUT;
            $EDGE
            @COLOR@
            [bg][fg]overlay=shortest=1:format=auto[out]
          "

          VI_MODE="${VERT_INT:-doux}"; [ "$VI_MODE" = plein ] || VI_MODE=doux
          echo "Retrait du vert sur toi : $VI_MODE"
          for VI_TRY in "$VI_MODE" plein; do
            COLOR=$(bash scripts/vert_interieur.sh "$VI_TRY" "$OW" "$OH")
            F="${FILTER/@COLOR@/"$COLOR"}"
            if ffmpeg -y \
              -i "input/video.mp4" \
              -framerate "$FPS" -loop 1 -i "$BG" \
              "${EDGE_IN[@]}" \
              -filter_complex "$F" \
              -map "[out]" -map 0:a? \
              -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p \
              -c:a aac -b:a 192k \
              output/result.mp4; then break; fi
            [ "$VI_TRY" = plein ] && exit 1
            echo "::warning::Retrait lissé du vert en échec : relance avec le réglage habituel (plein)."
          done

      - name: Vitesse (si différente de 1)
        if: steps.route.outputs.long != 'true' && github.event.inputs.vitesse != '' && github.event.inputs.vitesse != '1'
        env:
          VITESSE: ${{ github.event.inputs.vitesse }}
          FPSV: ${{ steps.orient.outputs.fps }}
        run: bash scripts/vitesse.sh output/result.mp4 - "$VITESSE" "${FPSV:-30}"

      - name: Upload du résultat en artifact
        if: steps.route.outputs.long != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: video-fond-remplace
          path: output/result.mp4
          retention-days: 14

      - name: Publier le résultat comme Release (gère les gros fichiers)
        if: steps.route.outputs.long != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="result-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Résultat run #${{ github.run_number }}" \
            --notes "Vidéo fond remplacé, générée automatiquement." \
            "output/result.mp4" || gh release upload "$TAG" "output/result.mp4" --repo "${{ github.repository }}" --clobber

      - name: Chaîne — jeton GitHub App
        id: chaine_tok
        if: steps.route.outputs.long != 'true' && github.event.inputs.enchainer == 'true' && vars.CHAINE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          # identifiant de TON app, réglé dans chaque dépôt : variable CHAINE_CLIENT_ID si tu l'as créée,
          # sinon CHAINE_APP_ID (réglage d'origine, qui marchait) — jamais d'identifiant écrit en dur
          client-id: ${{ vars.CHAINE_CLIENT_ID }}
          app-id: ${{ vars.CHAINE_CLIENT_ID == '' && vars.CHAINE_APP_ID || '' }}
          private-key: ${{ secrets.CHAINE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Montage-LV-final

      - name: Chaîne — transmettre à Montage LV final
        if: steps.route.outputs.long != 'true' && github.event.inputs.enchainer == 'true'
        env:
          CHAINE_VOIX_STUDIO: ${{ github.event.inputs.chaine_voix_studio }}
          CHAINE_SHORTS_SOUS_TITRES: ${{ github.event.inputs.chaine_shorts_sous_titres }}
          CHAINE_GH_TOKEN: ${{ steps.chaine_tok.outputs.token || secrets.CHAINE_TOKEN }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: bash scripts/chaine.sh envoyer output/result.mp4
