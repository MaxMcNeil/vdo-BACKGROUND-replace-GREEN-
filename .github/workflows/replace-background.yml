name: Replace Green Screen Background

permissions:
  contents: write
  actions: write

on:
  # Lancement manuel : tu précises le tag de la Release qui contient la vidéo
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la Release contenant la vidéo (ex: v1)'
        required: true
      video_asset:
        description: "Nom du fichier vidéo attaché à cette Release (ex: video.mp4)"
        required: true
      background_file:
        description: 'Nom du fichier image de fond dans input/ (ex: background.jpg)'
        required: false
        default: 'background.jpg'
      key_color:
        description: 'Couleur du fond vert en hex (ex: 139D74). Laisser vide = mesure automatique'
        required: false
        default: ''
      background_file_vertical:
        description: 'Image de fond pour les vidéos VERTICALES, dans input/ (ex: background-vertical.jpg)'
        required: false
        default: 'background-vertical.jpg'
      force_single:
        description: "Mettre 'true' pour forcer le traitement normal même si la vidéo est longue"
        required: false
        default: 'false'

jobs:
  replace-background:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Préparer les noms de fichiers
        id: files
        run: |
          BG="${{ github.event.inputs.background_file || 'background.jpg' }}"
          echo "bg=$BG" >> "$GITHUB_OUTPUT"

      - name: Télécharger la vidéo depuis la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input
          gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ github.event.inputs.video_asset }}" \
            --output "input/video.mp4" \
            --clobber

      - name: Vérifier que les fichiers existent
        run: |
          test -f "input/video.mp4" || (echo "Vidéo introuvable — vérifie le tag/nom d'asset de la Release" && exit 1)
          test -f "input/${{ steps.files.outputs.bg }}" || (echo "Image de fond introuvable dans input/" && exit 1)

      - name: Aiguillage (vidéo longue -> workflow dédié, découpage en parallèle)
        id: route
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LONG_MINUTES: '15'
          FORCE_SINGLE: ${{ github.event.inputs.force_single }}
          RCLONE_DEST: ${{ vars.RCLONE_DEST }}
          HAS_RCLONE: ${{ secrets.RCLONE_CONFIG != '' }}
          KEY_COLOR: ${{ github.event.inputs.key_color }}
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "input/video.mp4")
          echo "Durée de la vidéo : ${DUR}s (seuil vidéo longue : ${LONG_MINUTES} min)"
          if [ "$FORCE_SINGLE" = "true" ]; then
            echo "force_single=true : traitement normal."
          elif python3 -c "import sys; sys.exit(0 if float('$DUR') > float('$LONG_MINUTES')*60 else 1)"; then
            if [ -z "$RCLONE_DEST" ] || [ "$HAS_RCLONE" != "true" ]; then
              echo "::warning::Vidéo longue détectée, mais le stockage externe n'est pas configuré (secret RCLONE_CONFIG + variable RCLONE_DEST) : traitement normal, avec risque de dépasser les limites de GitHub."
            else
            ARGS=(-f "release_tag=${{ github.event.inputs.release_tag }}" -f "video_asset=${{ github.event.inputs.video_asset }}" -f "background_file=${{ steps.files.outputs.bg }}" -f "background_file_vertical=${{ github.event.inputs.background_file_vertical || 'background-vertical.jpg' }}" -f "dest=$RCLONE_DEST")
            [ -n "$KEY_COLOR" ] && ARGS+=(-f "key_color=$KEY_COLOR")
            gh workflow run replace-background-long.yml --repo "${{ github.repository }}" "${ARGS[@]}"
            echo "long=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Vidéo longue : traitement lancé dans le workflow 'vidéos longues' (onglet Actions). Le résultat sera envoyé sur ton stockage externe."
            fi
          fi

      - name: Détecter l'orientation de la vidéo (horizontale / verticale)
        id: orient
        if: steps.route.outputs.long != 'true'
        continue-on-error: true
        env:
          VIDEO_PATH: input/video.mp4
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          src = os.environ["VIDEO_PATH"]
          j = json.loads(subprocess.check_output(["ffprobe", "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=width,height:stream_side_data=rotation", "-of", "json", src]))
          s = j["streams"][0]
          w, h = int(s["width"]), int(s["height"])
          rot = 0
          for sd in s.get("side_data_list", []):
              if "rotation" in sd:
                  rot = int(round(float(sd["rotation"])))
          if abs(rot) % 180 == 90:      # vidéo tournée par métadonnée (téléphone) : on inverse
              w, h = h, w
          vertical = h > w
          k = min(1.0, 1920.0 / max(w, h))
          ow, oh = int(round(w * k / 2.0)) * 2, int(round(h * k / 2.0)) * 2
          print("Vidéo %dx%d -> %s, sortie %dx%d" % (w, h, "VERTICALE" if vertical else "horizontale", ow, oh))
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write("vertical=%s\nout_w=%d\nout_h=%d\n" % ("true" if vertical else "false", ow, oh))
          PY

      - name: Analyser le fond vert (couleur, tolérance, seuil)
        if: steps.route.outputs.long != 'true'
        env:
          KEY_OVERRIDE: ${{ github.event.inputs.key_color }}
        run: |
          cat > analyze.py <<'PY'
          import os, math, subprocess, statistics as st
          VIDEO = "input/video.mp4"
          W, H, N = 192, 108, 12
          dur = float(subprocess.check_output(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", VIDEO]).decode().strip())
          raw = subprocess.check_output(["ffmpeg", "-v", "error", "-i", VIDEO, "-vf", "fps=%.4f,scale=%d:%d:flags=area,format=rgb24" % (N / dur, W, H), "-frames:v", str(N), "-f", "rawvideo", "-"])
          fs = W * H * 3
          frames = [raw[i * fs:(i + 1) * fs] for i in range(len(raw) // fs)]

          def exg(p): return p[1] - (p[0] + p[2]) / 2
          def uvmag(r, g, b):
              u = -0.169 * r - 0.331 * g + 0.5 * b
              v = 0.5 * r - 0.419 * g - 0.081 * b
              return math.hypot(u, v)

          override = os.environ.get("KEY_OVERRIDE", "").strip().lstrip("#").upper()
          if len(override) == 6:
              R, G, B = [int(override[i:i + 2], 16) for i in (0, 2, 4)]
              print("Couleur imposée manuellement :", override)
          else:
              # Bords supposés libres : bandeau du haut + colonnes gauche/droite (haut de l'image)
              px = []
              for f in frames:
                  for y in range(H):
                      for x in range(W):
                          if y < H * 0.15 or ((x < W * 0.06 or x >= W * 0.94) and y < H * 0.60):
                              i = (y * W + x) * 3
                              px.append((f[i], f[i + 1], f[i + 2]))
              m = [st.median(p[i] for p in px) for i in range(3)]
              good = [p for p in px if abs(exg(p) - exg(m)) < 40 and p[1] > p[0] and p[1] > p[2]]
              if len(good) < 0.3 * len(px):
                  raise SystemExit("Mesure du fond vert peu fiable : relance avec key_color renseigné")
              R, G, B = [st.median(p[i] for p in good) for i in range(3)]
              R, G, B = round(R), round(G), round(B)

          EK = max(G - (R + B) / 2, 20.0)
          # Référence calibrée sur le tissu d'origine (#139D74 -> tolérance 0.10, seuil 100)
          ref = uvmag(19, 157, 116)
          SIM = min(max(0.10 * uvmag(R, G, B) / ref, 0.05), 0.16)
          lum = (R + G + B) / 3
          THR = min(max(100 * lum / 98.0, 70.0), 150.0)
          hexk = "%02X%02X%02X" % (R, G, B)
          print("Fond : #%s  EK=%.1f  tolérance=%.3f  seuil=%.1f" % (hexk, EK, SIM, THR))
          with open(os.environ["GITHUB_ENV"], "a") as e:
              e.write("KEY_HEX=%s\nKEY_R=%d\nKEY_G=%d\nKEY_B=%d\nKEY_EK=%.2f\nKEY_SIM=%.3f\nKEY_THR=%.1f\n" % (hexk, R, G, B, EK, SIM, THR))
          PY
          python3 analyze.py

      - name: Générer la table de couleurs (dé-mélange du vert)
        if: steps.route.outputs.long != 'true'
        run: |
          # Pour chaque couleur RGB possible : estime la part de fond vert dans le pixel,
          # reconstruit la vraie couleur du sujet (surtout utile sur les doigts flous),
          # puis plafonne le vert/bleu résiduel. Pixels sombres (cheveux) préservés.
          cat > mklut.py <<'PY'
          import os
          N = 65
          K = (float(os.environ["KEY_R"]), float(os.environ["KEY_G"]), float(os.environ["KEY_B"]))
          EK = float(os.environ["KEY_EK"])
          THR = float(os.environ["KEY_THR"])
          def f(r, g, b):
              a = 1 - max(g - (r + b) / 2, 0) / EK
              a = min(max(a, 0.4), 1.0)
              if (r + g + b) / 3 > THR:
                  r = min(max((r - (1 - a) * K[0]) / a, 0), 255)
                  g = min(max((g - (1 - a) * K[1]) / a, 0), 255)
                  b = min(max((b - (1 - a) * K[2]) / a, 0), 255)
              g = min(g, (r + b) / 2)
              b = min(b, r)
              return r, g, b
          with open("unmix.cube", "w") as o:
              o.write('TITLE "unmix"\nLUT_3D_SIZE %d\n' % N)
              for bi in range(N):
                  for gi in range(N):
                      for ri in range(N):
                          r, g, b = f(ri * 255 / (N - 1), gi * 255 / (N - 1), bi * 255 / (N - 1))
                          o.write("%.5f %.5f %.5f\n" % (r / 255, g / 255, b / 255))
          PY
          python3 mklut.py
          test -s unmix.cube

      - name: Composer la vidéo (chromakey + masque propre + couleurs reconstruites)
        if: steps.route.outputs.long != 'true' && steps.orient.outputs.vertical != 'true'
        run: |
          mkdir -p output
          BG="input/${{ steps.files.outputs.bg }}"

          # Masque : chromakey serré + érosion + léger flou. Couleur : table unmix.cube.
          FILTER="
            [1:v]scale=1920:1080,setsar=1[bg];
            [0:v]scale=1920:1080,setsar=1,split=2[a][c];
            [a]format=yuva420p,chromakey=0x$KEY_HEX:$KEY_SIM:0.06,alphaextract,erosion,erosion,erosion,boxblur=1:1[mat];
            [c]format=gbrp,lut3d=file=unmix.cube:interp=tetrahedral,format=rgba[cl];
            [cl][mat]alphamerge[fg];
            [bg][fg]overlay=shortest=1:format=auto[out]
          "

          ffmpeg -y \
            -i "input/video.mp4" \
            -loop 1 -i "$BG" \
            -filter_complex "$FILTER" \
            -map "[out]" -map 0:a? \
            -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            output/result.mp4

      - name: Composer la vidéo VERTICALE (même traitement, format portrait)
        if: steps.route.outputs.long != 'true' && steps.orient.outputs.vertical == 'true'
        run: |
          mkdir -p output
          BG="input/${{ github.event.inputs.background_file_vertical || 'background-vertical.jpg' }}"
          test -f "$BG" || { echo "Image de fond verticale introuvable : $BG"; exit 1; }
          OW=${{ steps.orient.outputs.out_w }}; OH=${{ steps.orient.outputs.out_h }}

          # Masque : chromakey serré + érosion + léger flou. Couleur : table unmix.cube.
          FILTER="
            [1:v]scale=$OW:$OH:force_original_aspect_ratio=increase,crop=$OW:$OH,setsar=1[bg];
            [0:v]scale=$OW:$OH,setsar=1,split=2[a][c];
            [a]format=yuva420p,chromakey=0x$KEY_HEX:$KEY_SIM:0.06,alphaextract,erosion,erosion,erosion,boxblur=1:1[mat];
            [c]format=gbrp,lut3d=file=unmix.cube:interp=tetrahedral,format=rgba[cl];
            [cl][mat]alphamerge[fg];
            [bg][fg]overlay=shortest=1:format=auto[out]
          "

          ffmpeg -y \
            -i "input/video.mp4" \
            -loop 1 -i "$BG" \
            -filter_complex "$FILTER" \
            -map "[out]" -map 0:a? \
            -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            output/result.mp4

      - name: Upload du résultat en artifact
        if: steps.route.outputs.long != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-fond-remplace
          path: output/result.mp4
          retention-days: 14

      - name: Publier le résultat comme Release (gère les gros fichiers)
        if: steps.route.outputs.long != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="result-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Résultat run #${{ github.run_number }}" \
            --notes "Vidéo fond remplacé, générée automatiquement." \
            "output/result.mp4"
